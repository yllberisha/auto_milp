[project]
name = "autoformalizer"
version = "0.1.0"
description = "Autonomous MILP formulation from optimization problem PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10.0",
    "pdfplumber>=0.10.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
